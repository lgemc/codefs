[workspace]
resolver = "2"
members = [
    "crates/python-parser",
    "crates/vfs-core",
    "crates/python-vfs",
    "crates/codefs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CodeFS Contributors"]
license = "MIT"
repository = "https://github.com/codefs/codefs"

[workspace.dependencies]
# Parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"

# Filesystem
fuser = "0.15"
libc = "0.2"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
tempfile = "3.14"

# Path handling
walkdir = "2.5"
